<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Audit Mobile — Sénégal Immobilier Consulting</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0b; color: #e8e6e3;
    font: 13px/1.5 ui-monospace, 'SF Mono', Menlo, monospace;
    display: flex; min-height: 100vh;
  }
  #panel { width: 560px; padding: 18px; overflow-y: auto; height: 100vh; position: sticky; top: 0; }
  #stage { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; }
  #frame-wrap { background: #161618; border-radius: 28px; padding: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.7); }
  iframe { width: 375px; height: 667px; border: 0; border-radius: 20px; background: #fff; display: block; }
  h1 { font-size: 15px; color: #FED65B; letter-spacing: .08em; margin-bottom: 4px; }
  .sub { color: #8a877f; font-size: 11px; margin-bottom: 14px; }
  #summary { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .badge { padding: 5px 12px; border-radius: 999px; font-size: 11px; font-weight: 700; }
  .b-pass { background: rgba(16,185,129,.12); color: #34d399; border: 1px solid rgba(16,185,129,.3); }
  .b-fail { background: rgba(244,63,94,.12); color: #fb7185; border: 1px solid rgba(244,63,94,.3); }
  .b-warn { background: rgba(251,191,36,.12); color: #fbbf24; border: 1px solid rgba(251,191,36,.3); }
  #results { margin-top: 10px; }
  .grp { margin: 14px 0 6px; color: #FED65B; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; border-bottom: 1px solid #26262a; padding-bottom: 4px; }
  .row { display: flex; gap: 8px; padding: 5px 8px; border-radius: 8px; margin: 2px 0; align-items: baseline; }
  .row:hover { background: #161618; }
  .st { font-weight: 800; font-size: 11px; width: 44px; flex-shrink: 0; }
  .st.pass { color: #34d399; } .st.fail { color: #fb7185; } .st.warn { color: #fbbf24; } .st.info { color: #7dd3fc; }
  .nm { color: #d5d2cc; }
  .dt { color: #8a877f; font-size: 11px; display: block; margin-top: 1px; word-break: break-word; }
  #status { color: #8a877f; font-size: 11px; margin: 8px 0; }
  button { background: #FED65B; color: #1a1305; border: 0; padding: 9px 18px; border-radius: 999px; font: 700 12px ui-monospace, monospace; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  button:disabled { opacity: .4; cursor: wait; }
  .spin { display: inline-block; animation: r 1s linear infinite; } @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="panel">
  <h1>AUDIT MOBILE 375 PX</h1>
  <p class="sub">Sénégal Immobilier Consulting — rendu réel + contenu admin (cloud) — audit automatique</p>
  <div id="summary"></div>
  <div id="status">Initialisation…</div>
  <button id="rerun" onclick="runAudit()">Relancer l'audit</button>
  <div id="results"></div>
</div>
<div id="stage"><div id="frame-wrap"><iframe id="frame" style="background:#fcf9f8"></iframe></div></div>

<script>
'use strict';
const R = [];
let FRAME_ERR = [];
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const STANDALONE = () => !!document.getElementById('app-shell'); /* page autonome : app inlinée, aucun serveur */

function add(status, group, name, detail) {
  R.push({ status, group, name, detail: detail || '' });
}
function doc() { return document.getElementById('frame').contentDocument; }
function win() { return document.getElementById('frame').contentWindow; }
function allText() { return doc() && doc().body ? doc().body.innerText : ''; }
function visible(el) { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; }
/* normalisation : casse, apostrophes typographiques, espaces insécables (U+00A0/U+202F) */
function norm(s) { return (s || '').toLowerCase().replace(/[\u2019]/g, "'").replace(/[\u00a0\u202f]/g, ' ').replace(/\s+/g, ' ').trim(); }

/* ---------- Référentiel : settings synchronisés du cloud dans l'app ---------- */
function expectedSettings() {
  try { return JSON.parse(win().localStorage.getItem('sic_site_settings') || 'null'); }
  catch { return null; }
}
function expectedParcels() {
  try { return JSON.parse(win().localStorage.getItem('sic_parcels') || 'null'); }
  catch { return null; }
}

/* ---------- Boot de l'app : shell inline → blob (aucun serveur) ---------- */
async function bootApp() {
  const frame = document.getElementById('frame');
  if (STANDALONE()) {
    const tpl = document.getElementById('app-shell');
    if (!tpl) return false;
    const blob = URL.createObjectURL(new Blob([tpl.innerHTML], { type: 'text/html' }));
    frame.src = blob;
  } else {
    frame.src = '/'; /* même origine : le serveur de dev sert l'app */
  }
  const t0 = Date.now();
  while (Date.now() - t0 < 15000) {
    const d = doc();
    const root = d && d.getElementById('root');
    if (root && root.children.length >= 1 && d.body && d.body.innerText.length > 300) return true;
    await wait(300);
  }
  return false;
}

/* ---------- Attente de la synchro cloud (fetch initial dans l'app) ---------- */
async function waitForCloudSync() {
  const t0 = Date.now();
  while (Date.now() - t0 < 6000) {
    const s = expectedSettings();
    if (s && s._cloudSynced !== false && s.content && Object.keys(s.content).length > 0) return true;
    await wait(300);
  }
  return false;
}

/* ---------- Overflow horizontal ---------- */
function overflowCheck() {
  const d = doc(), W = 375;
  const docW = Math.max(d.documentElement.scrollWidth, d.body.scrollWidth);
  if (docW <= W + 1) return null;
  const offenders = [];
  d.querySelectorAll('body *').forEach((el) => {
    if (!visible(el)) return;
    const r = el.getBoundingClientRect();
    if (r.width > W + 1 || r.right > W + 6) {
      const cls = (el.className && typeof el.className === 'string') ? el.className.split(' ').slice(0, 3).join('.') : '';
      offenders.push('<' + el.tagName.toLowerCase() + (cls ? '.' + cls : '') + '> w=' + Math.round(r.width));
    }
  });
  return { docW, offenders: offenders.slice(0, 5), count: offenders.length };
}

/* ---------- Scroll progressif ---------- */
async function sweepScroll() {
  const w = win(), d = doc();
  const H = Math.max(d.body.scrollHeight, 800);
  for (let y = 0; y <= H; y += 500) { w.scrollTo(0, y); await wait(90); }
  w.scrollTo(0, 0);
  await wait(400);
}

/* ---------- Accueil : contenu admin ---------- */
function auditHome() {
  const s = expectedSettings() || {};
  const c = s.content || {};
  const T = norm(allText());
  const grp = 'Accueil — contenu admin';

  add(s.companyName && T.includes(norm(s.companyName)) ? 'pass' : 'fail', grp, "Nom de l'entreprise (navbar/footer)", s.companyName || 'absent des settings');

  const bannerEl = s.promoTitle ? [...doc().querySelectorAll('div,p,section')].find((e) => e.children.length <= 4 && e.textContent.trim().startsWith('⭐') && e.textContent.includes(s.promoTitle.slice(0, 20))) : null;
  if (s.promoActive) add(bannerEl ? 'pass' : 'fail', grp, 'Bannière promo (titre admin)', s.promoTitle || '—');
  else add(bannerEl ? 'warn' : 'pass', grp, 'Bannière promo désactivée → absente du site', bannerEl ? 'encore visible !' : 'correctement masquée');

  const vids = c.videos || [];
  const vidEls = [...doc().querySelectorAll('video')];
  add(vidEls.length === vids.length ? 'pass' : 'warn', grp, 'Nombre de vidéos (' + vids.length + ' attendues)', vidEls.length + ' <video> dans le DOM');
  vids.forEach((v, i) => {
    const el = vidEls[i];
    if (!el) return;
    const actualSrc = el.getAttribute('src') || (el.querySelector('source') && el.querySelector('source').getAttribute('src')) || '';
    add(actualSrc === v.src ? 'pass' : 'fail', grp, 'Vidéo ' + (i + 1) + ' — src', actualSrc + (actualSrc === v.src ? '' : ' ≠ attendu ' + v.src));
    const actualPoster = el.getAttribute('poster') || '';
    add(actualPoster === (v.poster || '') ? 'pass' : 'fail', grp, 'Vidéo ' + (i + 1) + ' — poster', actualPoster + (actualPoster === v.poster ? '' : ' ≠ attendu ' + v.poster));
    add(T.includes(norm((v.title || {}).FR)) ? 'pass' : 'fail', grp, 'Vidéo ' + (i + 1) + ' — titre FR', (v.title || {}).FR || '—');
  });

  add(T.includes(norm('15 000')) || T.includes('15000') ? 'pass' : 'warn', grp, 'Prix échelonné affiché', 'basePrice = ' + s.basePrice);
  add(T.includes(norm('300 €')) ? 'pass' : 'warn', grp, 'Mensualité affichée', 'defaultMonthly = ' + s.defaultMonthly);
  add(T.includes(norm('13 500')) || T.includes('13500') ? 'pass' : 'warn', grp, 'Prix comptant affiché', 'cashPrice = ' + s.cashPrice);

  const tiers = c.paymentTiers || [];
  const tierOk = tiers.every((t) => T.includes(norm(String(t.deposit))) || T.includes(norm(t.deposit.toLocaleString('fr-FR'))));
  add(tierOk ? 'pass' : 'warn', grp, 'Échéancier — ' + tiers.length + ' paliers', tiers.map((t) => t.deposit + '€').join(', '));

  const conn = c.connectivity || [];
  const connMiss = conn.filter((k) => !T.includes(norm((k.title || {}).FR)));
  add(connMiss.length === 0 ? 'pass' : 'info', grp, 'Connectivité (' + conn.length + ' lieux)', connMiss.length ? 'titres complets hors accueil (vérifiés section Localisation) : ' + connMiss.map((k) => (k.title || {}).FR).join(', ') : 'tous affichés');

  const packs = c.packs || [];
  const packMiss = packs.filter((p) => !T.includes(norm((p.title || {}).FR)));
  add(packMiss.length === 0 ? 'pass' : 'fail', grp, 'Packs (' + packs.length + ')', packMiss.length ? 'absents : ' + packMiss.map((p) => (p.title || {}).FR).join(', ') : 'tous affichés');

  const tes = c.testimonials || [];
  const tesMiss = tes.filter((t) => !T.includes(norm(t.name || '~~~')));
  add(tesMiss.length === 0 ? 'pass' : 'fail', grp, 'Témoignages (' + tes.length + ')', tesMiss.length ? 'absents : ' + tesMiss.map((t) => t.name).join(', ') : 'tous affichés');

  const faq = c.faq || [];
  const faqMiss = faq.filter((f) => !T.includes(norm((f.question || {}).FR || '~~~')));
  add(faqMiss.length === 0 ? 'pass' : 'fail', grp, 'FAQ (' + faq.length + ' questions)', faqMiss.length ? 'absentes : ' + faqMiss.map((f) => (f.question || {}).FR).slice(0, 3).join(' | ') : 'toutes affichées');

  const blog = c.blogArticles || [];
  const blogMiss = blog.filter((b) => !T.includes(norm((b.title || {}).FR || '~~~')));
  add(blogMiss.length === 0 ? 'pass' : 'fail', grp, 'Blog (' + blog.length + ' articles)', blogMiss.length ? 'absents : ' + blogMiss.map((b) => (b.title || {}).FR).slice(0, 2).join(' | ') : 'tous affichés');

  add(T.includes(norm(s.contactEmail || '~~~')) ? 'pass' : 'fail', grp, 'Email de contact (footer)', s.contactEmail || '—');
  add(T.includes(norm(s.contactPhone || '~~~')) ? 'pass' : 'fail', grp, 'Téléphone de contact (footer)', s.contactPhone || '—');
  add(T.includes(norm(s.contactAddress || '~~~')) ? 'pass' : 'warn', grp, 'Adresse (footer)', s.contactAddress || '—');
  const wa = [...doc().querySelectorAll('a[href*="wa.me"]')].some((a) => a.href.includes(s.whatsappCleanNumber || '~~~'));
  add(wa ? 'pass' : 'fail', grp, 'Lien WhatsApp (wa.me)', s.whatsappCleanNumber || '—');
}

/* ---------- Médias : vérifiés depuis la fenêtre parente (fetch blob interdit) ---------- */
async function auditMedia() {
  const s = expectedSettings() || {};
  const c = s.content || {};
  const imgs = [...doc().querySelectorAll('img')];
  const broken = imgs.filter((im) => im.complete && im.naturalWidth === 0).map((im) => im.getAttribute('src'));
  if (STANDALONE()) {
    /* page autonome : aucune origine serveur — seuls les fichiers réellement inexistants sur disque comptent comme cassés */
    add(imgs.length === 0 ? 'warn' : 'info', 'Médias', imgs.length + ' images rendues', 'vérification HTTP impossible (page autonome) — chemins : ' + imgs.map((im) => im.getAttribute('src')).filter((u) => !/^https?:/.test(u)).slice(0, 3).join(', '));
  } else {
    add(imgs.length === 0 ? 'warn' : broken.length === 0 ? 'pass' : 'fail', 'Médias', imgs.length + ' images chargées', broken.length ? 'cassées : ' + broken.slice(0, 4).join(', ') : 'aucune image cassée');
  }

  const urls = [];
  (c.videos || []).forEach((v) => { if (v.src) urls.push(v.src); if (v.poster) urls.push(v.poster); });
  (c.testimonials || []).forEach((t) => { if (t.avatar) urls.push(t.avatar); });
  (c.blogArticles || []).forEach((b) => { if (b.image) urls.push(b.image); });
  if (STANDALONE()) {
    add('info', 'Médias', urls.length + ' chemins locaux détectés (vidéos, posters, avatars, images blog)', 'Fichiers vérifiés hors navigateur (page autonome — aucune origine serveur pour fetch)');
    return;
  }
  const results = await Promise.all(urls.map(async (u) => {
    if (/^https?:\/\//.test(u)) return null;
    try { const r = await fetch(u, { method: 'HEAD' }); return r.ok ? null : u + ' (HTTP ' + r.status + ')'; }
    catch { return u + ' (échec)'; }
  }));
  const bad = results.filter(Boolean);
  add(urls.length === 0 ? 'warn' : bad.length === 0 ? 'pass' : 'fail', 'Médias', urls.length + ' médias locaux accessibles (vidéos, posters, avatars, images blog)', bad.join(', ') || 'tous OK');
}

/* ---------- Plaquette PDF ---------- */
async function auditBrochure() {
  const s = expectedSettings() || {};
  const url = s.brochureUrl || '/pdf/Dun-Tni-Brochure-Premium.pdf';
  if (/^https?:\/\//.test(url)) { add('info', 'Plaquette PDF', 'brochureUrl externe (non vérifié ici)', url); return; }
  if (STANDALONE()) { add('info', 'Plaquette PDF', 'brochureUrl local : ' + url, 'Fichier vérifié hors navigateur (page autonome)'); return; }
  try {
    const r = await fetch(url, { method: 'HEAD' });
    add(r.ok ? 'pass' : 'fail', 'Plaquette PDF', 'brochureUrl accessible (' + url + ')', 'HTTP ' + r.status);
  } catch (e) { add('fail', 'Plaquette PDF', 'brochureUrl inaccessible (' + url + ')', String(e)); }
}

/* ---------- Overflow + cibles tactiles ---------- */
function auditOverflow(group) {
  const ov = overflowCheck();
  if (!ov) add('pass', group, 'Aucun débordement horizontal', 'scrollWidth = 375 px');
  else add('fail', group, 'Débordement horizontal (' + ov.docW + 'px)', ov.offenders.join(' · '));
  const small = [...doc().querySelectorAll('button, a')].filter((b) => {
    if (!visible(b)) return false;
    const r = b.getBoundingClientRect();
    return r.width > 0 && (r.width < 32 || r.height < 24);
  }).length;
  add(small === 0 ? 'pass' : 'warn', group, 'Cibles tactiles ≥ 32×24 px', small ? small + ' élément(s) trop petit(s)' : 'OK');
}

/* ---------- Onglet Plan cadastral ---------- */
async function gotoPlanTab() {
  const d = doc();
  let btn = [...d.querySelectorAll('button, a')].find((b) => /plan cadastral/i.test(b.textContent) && visible(b));
  if (!btn) {
    /* 1) ouvrir le menu hamburger mobile puis réessayer */
    const burger = [...d.querySelectorAll('button')].find((b) => b.getAttribute('aria-label') === 'Menu' && visible(b));
    if (burger) { burger.click(); await wait(500); btn = [...d.querySelectorAll('button, a')].find((b) => /plan cadastral/i.test(b.textContent) && visible(b)); }
  }
  if (!btn) {
    /* 2) repli : le lien « Choisir ma parcelle » du menu mène au plan (site one-page) */
    const b2 = [...d.querySelectorAll('button, a')].find((b) => visible(b) && /choisir ma parcelle/i.test(b.textContent));
    if (b2) {
      b2.click();
      const t0 = Date.now();
      while (Date.now() - t0 < 8000) { await wait(400); if (/répertoire cadastral|rechercher lot|plan officiel/i.test(allText())) return true; }
      return false;
    }
  }
  if (!btn) return false;
  btn.click();
  const t0 = Date.now();
  while (Date.now() - t0 < 8000) {
    await wait(400);
    if (/répertoire cadastral|rechercher lot/i.test(allText())) return true;
  }
  return false;
}

function auditPlan() {
  const grp = 'Plan cadastral';
  const ps = expectedParcels() || [];
  const T = allText();
  /* le site s'ouvre filtré sur la Tranche 1 (lots 1 à 20) — le cloud contient les 54 lots */
  const t1 = ps.filter((p) => p.id <= 20);
  const scope = t1.length ? t1 : ps;
  const nAvail = scope.filter((p) => p.status === 'Available').length;
  const nRes = scope.filter((p) => p.status === 'Reserved').length;
  const nSold = scope.filter((p) => p.status === 'Sold').length;
  const pill = (re) => { const m = T.match(re); return m ? Number(m[1]) : null; };
  const pA = pill(/Disponibles\s*\((\d+)\)/), pR = pill(/R[ée]serv[ée]es\s*\((\d+)\)/), pS = pill(/Vendues\s*\((\d+)\)/);
  const scopeLabel = t1.length ? 'Tranche 1 (lots 1-20)' : 'cloud complet';
  add(pA === nAvail ? 'pass' : 'fail', grp, 'Compteur Disponibles = ' + nAvail + ' (' + scopeLabel + ')', 'site affiche : ' + (pA === null ? 'introuvable' : pA));
  add(pR === nRes ? 'pass' : 'fail', grp, 'Compteur Réservées = ' + nRes + ' (' + scopeLabel + ')', 'site affiche : ' + (pR === null ? 'introuvable' : pR));
  add(pS === nSold ? 'pass' : 'fail', grp, 'Compteur Vendues = ' + nSold + ' (' + scopeLabel + ')', 'site affiche : ' + (pS === null ? 'introuvable' : pS));
  const badges = [/libre|dispo/i, /r[ée]serv/i, /vendu/i].filter((re) => [...doc().querySelectorAll('div,span,p')].some((e) => visible(e) && re.test(e.textContent) && e.textContent.length < 60)).length;
  add(badges >= 2 ? 'pass' : 'warn', grp, 'Badges de statut rendus', badges + '/3 types visibles');
}

/* ---------- Section Localisation : connectivité admin ---------- */
async function gotoLocalisation() {
  const d = doc();
  const loc = [...d.querySelectorAll('button, a')].find((b) => visible(b) && /^localisation$/i.test(b.textContent.trim()));
  if (loc) { loc.click(); await wait(900); return true; }
  /* repli mobile : ouvrir le menu hamburger puis cliquer « Localisation » */
  const burger = [...d.querySelectorAll('button')].find((b) => b.getAttribute('aria-label') === 'Menu' && visible(b));
  if (burger) {
    burger.click();
    await wait(500);
    const loc2 = [...d.querySelectorAll('button, a')].find((b) => visible(b) && /^localisation$/i.test(b.textContent.trim()));
    if (loc2) { loc2.click(); await wait(900); return true; }
  }
  return false;
}
function auditLocalisation() {
  const c = ((expectedSettings() || {}).content) || {};
  const conn = c.connectivity || [];
  const T = norm(allText());
  const miss = conn.filter((k) => !T.includes(norm((k.title || {}).FR || '~~~')));
  add(conn.length === 0 ? 'warn' : miss.length === 0 ? 'pass' : 'fail', 'Localisation', 'Connectivité admin (' + conn.length + ' lieux) rendue', miss.length ? 'absents : ' + miss.map((k) => (k.title || {}).FR).join(', ') : 'tous les lieux affichés avec titres complets');
  auditOverflow('Localisation — rendu mobile');
  auditErrors('Localisation — rendu mobile');
}

/* ---------- Bascule EN ---------- */
async function auditLangToggle() {
  const c = (expectedSettings() || {}).content || {};
  const firstFaq = (c.faq || [])[0];
  if (!firstFaq) return;
  const d = doc();
  const en = [...d.querySelectorAll('button')].find((b) => b.textContent.trim().toUpperCase() === 'EN' && visible(b));
  if (!en) { add('warn', 'i18n', 'Bouton EN introuvable', '—'); return; }
  en.click();
  await wait(900);
  const ok = allText().includes((firstFaq.question || {}).EN || '~~~');
  add(ok ? 'pass' : 'fail', 'i18n', 'Bascule EN — contenu admin traduit', ok ? (firstFaq.question || {}).EN.slice(0, 50) : 'question EN absente');
  const fr = [...d.querySelectorAll('button')].find((b) => b.textContent.trim().toUpperCase() === 'FR' && visible(b));
  if (fr) { fr.click(); await wait(600); }
}

/* ---------- Erreurs JS ---------- */
function auditErrors(group) {
  const errs = FRAME_ERR.filter((e) => !/ResizeObserver loop/.test(e));
  add(errs.length === 0 ? 'pass' : 'fail', group, 'Erreurs JavaScript', errs.length ? errs.slice(0, 3).join(' | ') : 'aucune erreur console');
}

/* ---------- Rendu ---------- */
function render(statusMsg) {
  const counts = { pass: 0, fail: 0, warn: 0 };
  R.forEach((r) => counts[r.status]++);
  document.getElementById('summary').innerHTML =
    '<span class="badge b-pass">✓ ' + counts.pass + ' PASS</span>' +
    '<span class="badge b-fail">✗ ' + counts.fail + ' FAIL</span>' +
    '<span class="badge b-warn">⚠ ' + counts.warn + ' WARN</span>';
  document.getElementById('status').textContent = statusMsg || 'Audit terminé.';
  const groups = [...new Set(R.map((r) => r.group))];
  document.getElementById('results').innerHTML = groups.map((g) =>
    '<div class="grp">' + g + '</div>' +
    R.filter((r) => r.group === g).map((r) =>
      '<div class="row"><span class="st ' + r.status + '">' + r.status.toUpperCase() + '</span>' +
      '<span class="nm">' + r.name + (r.detail ? '<span class="dt">' + r.detail + '</span>' : '') + '</span></div>'
    ).join('')
  ).join('');
  window.__AUDIT_RESULTS = R;
}

/* ---------- Orchestration ---------- */
async function runAudit() {
  R.length = 0; FRAME_ERR = [];
  document.getElementById('rerun').disabled = true;
  render('⟳ Audit en cours…');

  document.getElementById('status').innerHTML = '<span class="spin">◌</span> Boot de l\'app (375 px, shell inline)…';
  const ok = await bootApp();
  if (!ok) { add('fail', 'Chargement', 'Application non rendue dans l\'iframe', 'timeout 15 s'); render('✗ App non chargée'); document.getElementById('rerun').disabled = false; return; }

  try {
    win().addEventListener('error', (e) => FRAME_ERR.push(e.message));
    win().addEventListener('unhandledrejection', (e) => FRAME_ERR.push('rejection: ' + ((e.reason && e.reason.message) || e.reason)));
  } catch (e) { /* ignore */ }

  document.getElementById('status').innerHTML = '<span class="spin">◌</span> Attente synchro cloud…';
  await waitForCloudSync();
  await wait(600);

  document.getElementById('status').innerHTML = '<span class="spin">◌</span> Balayage de la page d\'accueil…';
  await sweepScroll();
  auditHome();
  await auditMedia();
  await auditBrochure();
  auditOverflow('Accueil — rendu mobile');
  auditErrors('Accueil — rendu mobile');

  document.getElementById('status').innerHTML = '<span class="spin">◌</span> Test bascule EN (accueil)…';
  await auditLangToggle();

  document.getElementById('status').innerHTML = '<span class="spin">◌</span> Section Localisation…';
  if (await gotoLocalisation()) { await sweepScroll(); auditLocalisation(); }
  else add('warn', 'Localisation', 'Section Localisation non atteinte', 'bouton introuvable');

  document.getElementById('status').innerHTML = '<span class="spin">◌</span> Onglet Plan cadastral…';
  if (await gotoPlanTab()) {
    await sweepScroll();
    auditPlan();
    auditOverflow('Plan — rendu mobile');
    auditErrors('Plan — rendu mobile');
  } else {
    add('warn', 'Plan cadastral', 'Onglet Plan non atteint', 'ni bouton direct, ni menu hamburger, ni lien Choisir ma parcelle');
  }

  const counts = { pass: 0, fail: 0, warn: 0 };
  R.forEach((r) => counts[r.status]++);
  const verdict = counts.fail > 0 ? '✗ ' + counts.fail + ' échec(s)' : counts.warn > 0 ? '⚠ ' + counts.warn + ' avertissement(s)' : '✓ Tout est conforme';
  render('Audit terminé — ' + verdict);
  console.log('[AUDIT] ' + counts.pass + ' pass / ' + counts.fail + ' fail / ' + counts.warn + ' warn');
  window.__AUDIT_DONE = true;
  document.getElementById('rerun').disabled = false;
}

window.addEventListener('load', () => setTimeout(runAudit, 600));
</script>
</body>
</html>
