<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` : la page déborde sous l'encoche et la barre
         d'accueil, ce qui permet à la navbar sombre de remplir tout l'écran.
         Contrepartie assumée : chaque zone collée à un bord réserve elle-même
         sa marge via `env(safe-area-inset-*)` (voir `src/index.css`). Sans
         `cover`, les insets iOS valent 0 et la barre resterait ceinturée d'un
         liseré clair. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00261a" />
    <!-- Icônes du site, déclinées de la marque : emblème, nom « SÉNÉGAL /
         INVESTMENT CONSULTING » et filet tricolore posés sur le vert de la
         marque (voir scripts/make-brand-assets.swift).
         Le .ico couvre les navigateurs qui le réclament encore, les deux PNG
         servent les onglets modernes et l'écran d'accueil iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="64x64" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <!-- Polices : chargées ici (et non par un @import CSS bloquant) pour que le
         navigateur démarre la requête en parallèle du parsing du bundle. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <!-- =================================================================
         Balises SEO / partage social — bloc géré automatiquement.

         Le build (`npm run build`) exécute scripts/prerender-routes.cjs, qui
         réécrit TOUT ce bloc, avec les URLs absolues du domaine, dans
         dist/index.html et dans une page par route (/fr, /en, /fr/plan,
         /en/plan, /fr/mentions-legales, /en/legal-notice). C'est ce HTML-là que
         lisent WhatsApp, Facebook, LinkedIn et X — qui n'exécutent pas le
         JavaScript.

         Les textes viennent de src/seo/routeMeta.json (source unique, aussi
         utilisée côté client par src/lib/seo.ts). Ne pas éditer les balises
         ci-dessous à la main : modifier le JSON.

         Le contenu actuel est le repli FR servi en dev et par tout hébergeur
         qui ne lancerait pas le postbuild (image absolue Supabase, car un
         og:image relatif est ignoré par les crawlers).
         ================================================================= -->
    <!-- seo:route:start -->
    <title>Acheter un terrain au Sénégal | Sébikhotane dès 300 €/mois</title>
    <meta name="description" content="Parcelles de 150 m² à Sébikhotane, délibération + NICAD, à 20 min de l'AIBD et 4 km du TER. Acompte 3 000 € puis 300 €/mois, sécurisé diaspora." />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://votre-domaine.com/fr" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Senegal Investment Consulting" />
    <meta property="og:title" content="Acheter un terrain au Sénégal | Sébikhotane dès 300 €/mois" />
    <meta property="og:description" content="Parcelles de 150 m² à Sébikhotane, délibération + NICAD, à 20 min de l'AIBD et 4 km du TER. Acompte 3 000 € puis 300 €/mois, sécurisé diaspora." />
    <meta property="og:url" content="https://votre-domaine.com/fr" />
    <meta property="og:image" content="https://ywvztcdgssbgeawkcphe.supabase.co/storage/v1/object/public/site-media/images/hero.jpg" />
    <meta property="og:image:secure_url" content="https://ywvztcdgssbgeawkcphe.supabase.co/storage/v1/object/public/site-media/images/hero.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vue aérienne des 54 parcelles du domaine Dun Tni à Sébikhotane, Sénégal" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Acheter un terrain au Sénégal | Sébikhotane dès 300 €/mois" />
    <meta name="twitter:description" content="Parcelles de 150 m² à Sébikhotane, délibération + NICAD, à 20 min de l'AIBD et 4 km du TER. Acompte 3 000 € puis 300 €/mois, sécurisé diaspora." />
    <meta name="twitter:image" content="https://ywvztcdgssbgeawkcphe.supabase.co/storage/v1/object/public/site-media/images/hero.jpg" />
    <meta name="twitter:image:alt" content="Vue aérienne des 54 parcelles du domaine Dun Tni à Sébikhotane, Sénégal" />
    <!-- seo:route:end -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
